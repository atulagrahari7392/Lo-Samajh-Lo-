services:
  - type: web
    name: lo-samajh-lo
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NPM_FLAGS
        value: --include=dev
      - key: JWT_SECRET
        generateValue: true
